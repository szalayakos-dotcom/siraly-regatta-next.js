  <!-- GOMBOK -->
  <script
     id="script15"><![CDATA[
var s={gross:true,fock:true,genua:false,spinn:false,genakker:false};
function op(id,v){var e=document.getElementById(id);if(e)e.setAttribute('opacity',v?'1':'0');}
function ba(id,v){var r=document.getElementById('rbg-'+id);if(r){r.setAttribute('opacity',v?'1':'0.5');r.setAttribute('stroke-width',v?'3':'1.5');}}
function tG(){s.gross=!s.gross;op('layer-gross',s.gross);ba('gross',s.gross);}
function tF(){if(!s.fock){s.fock=true;s.genua=false;op('layer-fock',1);op('layer-genua',0);ba('fock',1);ba('genua',0);}else{s.fock=false;op('layer-fock',0);ba('fock',0);}}
function tGe(){if(!s.genua){s.genua=true;s.fock=false;op('layer-genua',1);op('layer-fock',0);ba('genua',1);ba('fock',0);}else{s.genua=false;op('layer-genua',0);ba('genua',0);}}
function tS(){if(!s.spinn){s.spinn=true;s.genakker=false;op('layer-spinn',1);op('layer-genakker',0);ba('spinn',1);ba('genakker',0);}else{s.spinn=false;op('layer-spinn',0);ba('spinn',0);}}
function tGa(){if(!s.genakker){s.genakker=true;s.spinn=false;op('layer-genakker',1);op('layer-spinn',0);ba('genakker',1);ba('spinn',0);}else{s.genakker=false;op('layer-genakker',0);ba('genakker',0);}}
ba('gross',1);ba('fock',1);
]]></script>
